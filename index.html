<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player Landing Page</title>
    <link type="image/png" sizes="16x16" rel="icon" href="./icons8-star-connect-color-16.png">
    <link type="image/png" sizes="32x32" rel="icon" href="./icons8-star-connect-color-32.png">
    <link type="image/png" sizes="96x96" rel="icon" href="./icons8-star-connect-color-96.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Three.js Import Map -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/"
        }
    }
    </script>
    <style>
        /* Custom scrollbar for webkit browsers */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a202c; /* Tailwind gray-900 */
        }
        ::-webkit-scrollbar-thumb {
            background: #4a5568; /* Tailwind gray-600 */
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #718096; /* Tailwind gray-500 */
        }
        
        /* Core Layout Structure */
        html {
            height: 100%;
        }
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow: hidden; /* Prevent body scroll */
            background-color: #111827; /* gray-900 */
        }
        input:focus, select:focus, button:focus, input[type="range"]:focus {
            outline: 2px solid transparent;
            outline-offset: 2px;
            border-color: #63b3ed; /* blue-400 */
            box-shadow: 0 0 0 2px rgba(99, 179, 237, 0.5);
        }

        /* App Layout */
        .main-content-area { /* Center Player */
            flex-grow: 1;
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        
        /* Header */
        .app-header {
            padding: 1rem 2rem;
            background-color: #1f2937;
            border-bottom: 1px solid #374151;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        /* Music Player Styles */
        #threeContainer {
            cursor: grab;
            width: 100%;
            max-width: 800px;
            height: 400px;
            background-color: #111827;
            border-radius: 0.5rem;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }
        #threeContainer:active {
            cursor: grabbing;
        }
        .player-button {
            background-color: #4a5568;
            color: white;
            padding: 0.5rem;
            border-radius: 9999px; /* circular buttons */
            transition: background-color 0.2s, transform 0.1s;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
        }
        .player-button:hover {
            background-color: #6b7280;
        }
        .player-button:active {
            transform: scale(0.95);
        }
        .player-button:disabled {
            background-color: #374151;
            cursor: not-allowed;
            opacity: 0.7;
        }
       
        /* Autoplay Overlay */
        #autoplay-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.5s ease-out;
        }

        /* Footer Styles */
        .app-footer {
            flex-shrink: 0; 
            background-color: #111827;
            border-top: 1px solid #374151; 
            padding: 1rem;
            text-align: center;
        }

    </style>
</head>
<body class="text-white font-sans antialiased">
    
    <div id="autoplay-overlay">
        <div class="text-center">
            <h2 class="text-3xl font-bold text-white mb-2">Welcome</h2>
            <p class="text-gray-300">Click anywhere to begin the experience.</p>
        </div>
    </div>

    <header class="app-header">
        <h1 class="text-xl font-bold text-blue-400">My Landing Page</h1>
        <a href="calculator.html" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg text-sm transition duration-300">
            Financial Tools
        </a>
    </header>

    <main class="main-content-area">
        <div id="nowPlaying" class="mb-4">
            <h2 id="nowPlayingTrack" class="text-2xl font-bold text-blue-400">Ambient Music Player</h2>
            <p class="text-gray-400">Press play to begin</p>
        </div>
        
        <div id="threeContainer"></div>
        
        <div class="flex items-center gap-4 mt-4 w-full max-w-md">
            <button id="playPauseBtn" class="player-button"><i data-lucide="play" class="w-6 h-6"></i></button>
            <div class="flex-grow flex items-center gap-2">
                <i data-lucide="volume-2" class="text-gray-400"></i>
                <input type="range" id="volumeSlider" min="0" max="100" value="50" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
            </div>
        </div>
    </main>
    
    <footer class="app-footer">
        <p class="text-xs sm:text-sm text-gray-500">&copy; <span id="currentYearFooter"></span> Music Player & Financial Tools.</p>
    </footer>

    <audio id="audioElement" preload="metadata"></audio>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- DOM Elements ---
        const DOMElements = {
            audioElement: document.getElementById('audioElement'),
            playPauseBtn: document.getElementById('playPauseBtn'),
            volumeSlider: document.getElementById('volumeSlider'),
            currentYearFooter: document.getElementById('currentYearFooter'),
            nowPlayingTrack: document.getElementById('nowPlayingTrack'),
            autoplayOverlay: document.getElementById('autoplay-overlay'),
        };

        // --- Preloaded Tracks ---
        const preloadedTracks = [
        { name: "We Will Return english", url: "assets/song1.mp3" },
        { name: "Chill Abstract Beat", url: "assets/song2.mp3" },
        { name: "Vorwärts, kanadische Arbeiter!", url: "assets/song3.mp3" },
        { name: "Auf, Sozialisten, schließt die Reihen", url: "assets/song4.mp3" },
        { name: "Blutrot Klarer Morgen", url: "assets/song5.mp3" },
        { name: "Rust Bike", url: "assets/song6.mp3" },
        { name: "Einheitsfrontlied ", url: "assets/song7.mp3" },
        { name: "Die Internationale", url: "assets/song8.mp3" },
        { name: "We Will Return", url: "assets/song9.mp3" },
        { name: "Without the Communist Party, There Would Be No New Canada", url: "assets/song10.mp3" }
    ];

        // --- Music Player State & Web Audio API ---
        let audioContext;
        let analyserNode;
        let sourceNode;
        let currentTrackIndex = 0;
        let isPlaying = false;
        const FFT_SIZE = 512;
        
        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyserNode = audioContext.createAnalyser();
                analyserNode.fftSize = FFT_SIZE;
                sourceNode = audioContext.createMediaElementSource(DOMElements.audioElement);
                sourceNode.connect(analyserNode);
                analyserNode.connect(audioContext.destination);
            }
        }

        function loadTrack(index) {
            if (index < 0 || index >= preloadedTracks.length) return;
            currentTrackIndex = index;
            const track = preloadedTracks[currentTrackIndex];
            DOMElements.audioElement.src = track.url;
            DOMElements.audioElement.load();
            DOMElements.nowPlayingTrack.textContent = track.name;
        }
        
        function playTrack() {
            DOMElements.audioElement.play().then(() => {
                isPlaying = true;
                updatePlayPauseIcon();
            }).catch(error => console.error("Playback failed:", error));
        }

        function pauseTrack() {
            DOMElements.audioElement.pause();
            isPlaying = false;
            updatePlayPauseIcon();
        }

        function togglePlayPause() {
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }

            if (isPlaying) {
                pauseTrack();
            } else {
                playTrack();
            }
        }
        
        function updatePlayPauseIcon() {
            const icon = isPlaying ? 'pause' : 'play';
            DOMElements.playPauseBtn.innerHTML = `<i data-lucide="${icon}" class="w-6 h-6"></i>`;
            lucide.createIcons();
        }

        function handleTrackEnd() {
            // Play next track and loop
            currentTrackIndex = (currentTrackIndex + 1) % preloadedTracks.length;
            loadTrack(currentTrackIndex);
            playTrack();
        }

        function updateVolume() {
            const vol = DOMElements.volumeSlider.value / 100;
            DOMElements.audioElement.volume = vol;
        }
        
        // --- Three.js Wireframe Visualizer ---
        let threeScene, threeCam, threeRenderer, wireframe, controls;
        let originalPositions;

        function initThreeVisualizer() {
          const container = document.getElementById('threeContainer');
          // Scene & Camera
          threeScene = new THREE.Scene();
          threeCam = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
          threeCam.position.set(0, 0, 3.5);
          // Renderer
          threeRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
          threeRenderer.setPixelRatio(window.devicePixelRatio);
          threeRenderer.setSize(container.clientWidth, container.clientHeight);
          container.appendChild(threeRenderer.domElement);
          // OrbitControls
          controls = new OrbitControls(threeCam, threeRenderer.domElement);
          controls.enableDamping = true;
          // Geometry
          const baseGeometry = new THREE.IcosahedronGeometry(1.5, 6); // More complex base shape
          originalPositions = baseGeometry.attributes.position.clone();
          const wireframeGeo = new THREE.WireframeGeometry(baseGeometry);
          const mat = new THREE.LineBasicMaterial({ color: 0x63b3ed, linewidth: 2 });
          wireframe = new THREE.LineSegments(wireframeGeo, mat);
          threeScene.add(wireframe);
          // Handle resize
          window.addEventListener('resize', () => {
            threeCam.aspect = container.clientWidth / container.clientHeight;
            threeCam.updateProjectionMatrix();
            threeRenderer.setSize(container.clientWidth, container.clientHeight);
          });
        }
        
        function animateThree() {
          requestAnimationFrame(animateThree);
          if(analyserNode && isPlaying) {
              const freqData = new Uint8Array(analyserNode.frequencyBinCount);
              analyserNode.getByteFrequencyData(freqData);
              
              const geometry = wireframe.geometry;
              const positions = geometry.attributes.position;
              
              // Manipulate vertices based on frequency data
              for (let i = 0; i < positions.count; i++) {
                  const originalX = originalPositions.getX(i);
                  const originalY = originalPositions.getY(i);
                  const originalZ = originalPositions.getZ(i);

                  const freqIndex = i % freqData.length;
                  const amplitude = freqData[freqIndex] / 256;

                  const displacement = 1 + amplitude * 0.5;
                  
                  positions.setX(i, originalX * displacement);
                  positions.setY(i, originalY * displacement);
                  positions.setZ(i, originalZ * displacement);
              }
              positions.needsUpdate = true;
          }
          wireframe.rotation.x += 0.001;
          wireframe.rotation.y += 0.002;
          controls.update();
          threeRenderer.render(threeScene, threeCam);
        }
        
        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            DOMElements.currentYearFooter.textContent = new Date().getFullYear();
            lucide.createIcons();
            
            initThreeVisualizer();
            animateThree();
            
            // Load the first track but don't play yet
            loadTrack(0);
            
            // Event Listeners
            DOMElements.playPauseBtn.addEventListener('click', togglePlayPause);
            DOMElements.volumeSlider.addEventListener('input', updateVolume);
            DOMElements.audioElement.addEventListener('ended', handleTrackEnd);

            // Autoplay handler
            DOMElements.autoplayOverlay.addEventListener('click', () => {
                initAudioContext();
                playTrack();
                DOMElements.autoplayOverlay.style.opacity = '0';
                setTimeout(() => {
                    DOMElements.autoplayOverlay.style.display = 'none';
                }, 500);
            }, { once: true });
        });
    </script>
</body>
</html>
